<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ObraVoz v6</title><style>body{font-family:system-ui;margin:0;background:#f5f5f5;color:#171717}main{max-width:720px;margin:auto;padding:20px}h1{margin:8px 0}.sub{color:#666;margin-bottom:20px}.card{background:#fff;border-radius:16px;padding:18px;margin:12px 0;box-shadow:0 1px 5px #0001}button{width:100%;padding:16px;border:0;border-radius:12px;background:#111;color:#fff;font-size:18px;font-weight:650}#stop{background:#a11;margin-top:10px}.status{font-weight:600;margin:10px 0}.timer{text-align:center;font-size:30px;margin:12px}.hidden{display:none}.error{color:#a11;white-space:pre-wrap}.ok{color:#176b2c}label{display:block;font-weight:700;margin:14px 0 5px}input,textarea{width:100%;box-sizing:border-box;border:1px solid #ccc;border-radius:10px;padding:12px;font:inherit;background:#fff}textarea{min-height:90px}.small{font-size:13px;color:#666}</style></head><body><main><h1>ObraVoz v6</h1><div class="sub">Dicta la visita y la app la convierte en una ficha de obra.</div><div class="card"><div id="status" class="status">Listo para grabar</div><div id="timer" class="timer">00:00</div><button id="start">Grabar visita</button><button id="stop" class="hidden">Parar y procesar</button><div class="small">No usa SpeechRecognition del navegador.</div></div><div id="result" class="card hidden"><label>Obra</label><input id="obra"><label>Trabajo realizado</label><textarea id="trabajo"></textarea><label>Material utilizado</label><textarea id="usado"></textarea><label>Material pendiente</label><textarea id="pendiente"></textarea><label>Próxima visita</label><textarea id="proxima"></textarea><label>Transcripción</label><textarea id="transcript"></textarea></div></main><script>
let ctx,processor,stream,chunks=[],recording=false,startedAt,timerId,inputRate;
const $=id=>document.getElementById(id);
function status(t,c=""){ $("status").textContent=t;$("status").className="status "+c }
function tm(s){return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}
$("start").onclick=async()=>{try{stream=await navigator.mediaDevices.getUserMedia({audio:true});ctx=new(window.AudioContext||window.webkitAudioContext)();inputRate=ctx.sampleRate;const src=ctx.createMediaStreamSource(stream);processor=ctx.createScriptProcessor(4096,1,1);chunks=[];processor.onaudioprocess=e=>{if(recording)chunks.push(new Float32Array(e.inputBuffer.getChannelData(0)))};src.connect(processor);processor.connect(ctx.destination);recording=true;startedAt=Date.now();$("start").classList.add("hidden");$("stop").classList.remove("hidden");status("Grabando…");timerId=setInterval(()=>$("timer").textContent=tm(Math.floor((Date.now()-startedAt)/1000)),250)}catch(e){status("No se puede usar el micrófono: "+(e.message||e),"error")}};
$("stop").onclick=async()=>{if(!recording)return;recording=false;clearInterval(timerId);$("start").classList.remove("hidden");$("stop").classList.add("hidden");try{processor.disconnect();processor.onaudioprocess=null;stream.getTracks().forEach(t=>t.stop());const wav=makeWav(resample(chunks.flatMap(x=>Array.from(x)),inputRate,16000),16000);status("Enviando audio…");const fd=new FormData();fd.append("audio",wav,"visita.wav");const r=await fetch("/api/process",{method:"POST",body:fd});const raw=await r.text();let d;try{d=JSON.parse(raw)}catch{throw Error("Respuesta no válida del servidor: "+raw.slice(0,300))}if(!r.ok)throw Error(d.error||"Error del servidor");$("obra").value=d.obra||"";$("trabajo").value=d.trabajo||"";$("usado").value=d.material_usado||"";$("pendiente").value=d.material_pendiente||"";$("proxima").value=d.proxima_visita||"";$("transcript").value=d.transcript||"";$("result").classList.remove("hidden");status("Visita procesada","ok")}catch(e){status("Error: "+(e.message||e),"error")}finally{$("timer").textContent="00:00";if(ctx)await ctx.close().catch(()=>{})}};
function resample(a,ir,or){if(ir===or)return new Float32Array(a);const ratio=ir/or,n=Math.round(a.length/ratio),o=new Float32Array(n);for(let i=0;i<n;i++){const p=i*ratio,j=Math.floor(p),f=p-j,o1=a[j]||0,o2=a[j+1]||o1;o[i]=o1+(o2-o1)*f}return o}
function makeWav(a,rate){const b=new ArrayBuffer(44+a.length*2),v=new DataView(b),ws=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i))};ws(0,"RIFF");v.setUint32(4,36+a.length*2,true);ws(8,"WAVE");ws(12,"fmt ");v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,rate,true);v.setUint32(28,rate*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);ws(36,"data");v.setUint32(40,a.length*2,true);let o=44;for(const s of a){const x=Math.max(-1,Math.min(1,s));v.setInt16(o,x<0?x*32768:x*32767,true);o+=2}return new Blob([v],{type:"audio/wav"})}
</script></body></html>
